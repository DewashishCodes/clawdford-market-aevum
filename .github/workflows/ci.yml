name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge test + Shanghai check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format check
        working-directory: contracts
        run: forge fmt --check
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: FOUNDRY_PROFILE=ci forge test -vv
      - name: Shanghai opcode check
        run: node tools/check-shanghai.mjs contracts/out

  typescript:
    name: TypeScript (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tool self-tests
        run: node --test tools/check-shanghai.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
